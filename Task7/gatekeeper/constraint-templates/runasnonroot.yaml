apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredsecurity
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredSecurity
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredsecurity

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          not c.securityContext.runAsNonRoot
          msg := "runAsNonRoot=true is required"
        }

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          not c.securityContext.readOnlyRootFilesystem
          msg := "readOnlyRootFilesystem=true is required"
        }
